<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>✨ Un pequeño detalle para ti ✨</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: radial-gradient(ellipse at 20% 50%, #1a0533 0%, #0d0620 40%, #000510 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Outfit', sans-serif;
      color: #fff;
    }

    /* ── Stars canvas ── */
    #star-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Floating hearts ── */
    .hearts-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1;
      overflow: hidden;
    }

    .heart {
      position: absolute;
      bottom: -60px;
      font-size: 1.6rem;
      animation: riseUp linear infinite;
      opacity: 0;
      filter: drop-shadow(0 0 6px rgba(255,100,150,0.7));
    }

    @keyframes riseUp {
      0%   { transform: translateY(0) rotate(-10deg) scale(0.8); opacity: 0; }
      10%  { opacity: 0.8; }
      50%  { transform: translateY(-45vh) rotate(10deg) scale(1); }
      90%  { opacity: 0.4; }
      100% { transform: translateY(-105vh) rotate(-5deg) scale(0.9); opacity: 0; }
    }

    /* ── Main card ── */
    .card {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 3.5rem 3rem;
      max-width: 600px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,200,220,0.2);
      border-radius: 32px;
      backdrop-filter: blur(16px);
      box-shadow:
        0 0 60px rgba(255,80,130,0.15),
        0 0 120px rgba(140,60,200,0.1),
        inset 0 0 60px rgba(255,255,255,0.02);
      animation: cardAppear 1.4s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      opacity: 0;
      transform: translateY(40px) scale(0.95);
    }

    @keyframes cardAppear {
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* ── Glowing ring ── */
    .ring {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      margin: 0 auto 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3.2rem;
      background: radial-gradient(circle, rgba(255,150,180,0.25) 0%, transparent 70%);
      animation: pulse 2.5s ease-in-out infinite;
      position: relative;
    }

    .ring::before {
      content: '';
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      border: 2px solid transparent;
      background: linear-gradient(135deg, #ff6b9d, #c44dff, #4da6ff, #ff6b9d) border-box;
      -webkit-mask: linear-gradient(#fff 0 0) padding-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: destination-out;
      mask-composite: exclude;
      animation: spinRing 4s linear infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50%       { transform: scale(1.08); }
    }

    @keyframes spinRing {
      to { transform: rotate(360deg); }
    }

    /* ── Typography ── */
    .subtitle {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1rem;
      letter-spacing: 3px;
      color: #e0a0c0;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeSlide 1s ease-out 0.8s forwards;
    }

    h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      margin: 1rem 0;
      background: linear-gradient(135deg, #fff 0%, #ffd6e7 40%, #e8b4ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1.2;
      opacity: 0;
      animation: fadeSlide 1s ease-out 1.1s forwards;
    }

    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff6b9d, transparent);
      margin: 1.5rem auto;
      opacity: 0;
      animation: fadeSlide 1s ease-out 1.4s forwards;
    }

    .poem {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.15rem;
      line-height: 1.9;
      color: #f0d0e0;
      margin-bottom: 2rem;
      opacity: 0;
      animation: fadeSlide 1s ease-out 1.7s forwards;
    }

    .poem em {
      color: #ffa0c0;
      font-style: normal;
      font-weight: 700;
    }

    .closing {
      font-size: 0.95rem;
      color: rgba(255,255,255,0.5);
      letter-spacing: 1px;
      opacity: 0;
      animation: fadeSlide 1s ease-out 2.2s forwards;
    }

    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Music note indicator ── */
    .music-indicator {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 20px;
      border-radius: 50px;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      z-index: 20;
      opacity: 0;
      animation: fadeSlide 1s ease-out 2.8s forwards;
      backdrop-filter: blur(8px);
    }

    .music-bars {
      display: flex;
      align-items: flex-end;
      gap: 3px;
      height: 16px;
    }

    .music-bars span {
      display: block;
      width: 3px;
      background: #ff6b9d;
      border-radius: 2px;
      animation: equalize 0.8s ease-in-out infinite;
    }

    .music-bars span:nth-child(1) { height: 40%; animation-delay: 0s; }
    .music-bars span:nth-child(2) { height: 80%; animation-delay: 0.15s; }
    .music-bars span:nth-child(3) { height: 60%; animation-delay: 0.3s; }
    .music-bars span:nth-child(4) { height: 100%; animation-delay: 0.1s; }
    .music-bars span:nth-child(5) { height: 50%; animation-delay: 0.25s; }

    @keyframes equalize {
      0%, 100% { transform: scaleY(0.4); }
      50%       { transform: scaleY(1); }
    }

    /* ── Hidden YouTube iframe ── */
    #yt-player {
      position: fixed;
      left: -9999px;
      top: -9999px;
      width: 1px;
      height: 1px;
    }
  </style>
</head>
<body>

  <!-- Stars -->
  <canvas id="star-canvas"></canvas>

  <!-- Floating hearts -->
  <div class="hearts-container" id="hearts"></div>

  <!-- Main card -->
  <div class="card">
    <div class="ring">💖</div>
    <p class="subtitle">♪ para ti ♪</p>
    <h1>Eres algo especial en este mundo</h1>
    <div class="divider"></div>
    <p class="poem">
      En la quietud de un instante,<br/>
      existe alguien que <em>piensa en ti</em>.<br/>
      No con grandes palabras,<br/>
      sino con <em>gestos del corazón</em>.<br/>
      Porque tú mereces ser recordada<br/>
      en cada <em>detalle bonito</em> de la vida.
    </p>
    <p class="closing">✦ &nbsp; con cariño &nbsp; ✦</p>
  </div>

  <!-- Music note indicator -->
  <div class="music-indicator">
    <div class="music-bars">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    Reproduciendo melodía para ti
  </div>

  <!-- Hidden YouTube embed for autoplay music -->
  <iframe
    id="yt-player"
    src="https://www.youtube.com/embed/gczoYsmFSK0?autoplay=1&mute=0&controls=0&loop=1&playlist=gczoYsmFSK0"
    allow="autoplay"
    frameborder="0"
  ></iframe>

  <script>
    // ── Star field ──
    const canvas = document.getElementById('star-canvas');
    const ctx = canvas.getContext('2d');
    let stars = [];

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function initStars() {
      stars = Array.from({ length: 160 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.3,
        alpha: Math.random(),
        speed: Math.random() * 0.005 + 0.002,
        phase: Math.random() * Math.PI * 2,
      }));
    }

    function drawStars(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      stars.forEach(s => {
        const a = 0.4 + 0.5 * Math.sin(s.phase + t * s.speed);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,220,240,${a})`;
        ctx.fill();
      });
      requestAnimationFrame(drawStars);
    }

    resize();
    initStars();
    window.addEventListener('resize', () => { resize(); initStars(); });
    requestAnimationFrame(drawStars);

    // ── Floating hearts ──
    const heartsContainer = document.getElementById('hearts');
    const heartEmojis = ['💗', '💕', '💖', '✨', '🌸', '💫', '💝', '🌷'];

    function spawnHeart() {
      const el = document.createElement('span');
      el.className = 'heart';
      el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (1.2 + Math.random() * 1.4) + 'rem';
      const dur = 7 + Math.random() * 6;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay = '0s';
      heartsContainer.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000);
    }

    // Spawn hearts continuously
    spawnHeart();
    setInterval(spawnHeart, 600);
  </script>
</body>
</html>
